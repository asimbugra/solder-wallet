; Solder: a Solana hardware wallet you build yourself from an ESP32.
; The web interface (web/index.html) is packed into src/web_ui.h before every build.

[solder]
lib_deps =
    https://github.com/infraticxyz-lab/Infratic-lib.git#1ffdbea6e6817233761b2717bbbfce6edf4323b4
    bblanchon/ArduinoJson@6.21.6
    rweather/Crypto@0.4.0

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
extra_scripts =
    pre:web/build.py
    pre:tools/infratic_build.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=esp_core_dump_write

; ESP32 dev board, no screen. Approve with the BOOT button.
[env:esp32dev]
lib_deps = ${solder.lib_deps}

; Same board with a 0.96" SSD1306 OLED on I2C (SDA 21, SCL 22).
; The screen shows what you are signing, so a hacked browser can't hide it.
[env:esp32dev-oled]
lib_deps =
    ${solder.lib_deps}
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    ${env.build_flags}
    -DSOLDER_OLED=1
